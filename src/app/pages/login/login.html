<div class="login-wrapper">

  <div class="login-card">

    <h1>Library Management System</h1>
    <p class="subtitle">Login to continue</p>

    <input 
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
    >

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
    >

    <button (click)="login()">
      Login
    </button>

    <a class="reset-link" routerLink="/reset-password">
      Reset Password
    </a>

    <p class="signup-text">
      Don't have an account?
      <a routerLink="/signup">Signup</a>
    </p>

  </div>

</div>
