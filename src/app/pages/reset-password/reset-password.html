<div class="auth-card">

  <h2>Reset Password</h2>

  <input
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
    class="input-field"
  />

  <input
    type="password"
    placeholder="New Password"
    [(ngModel)]="newPassword"
    class="input-field"
  />

  <input
    type="password"
    placeholder="Confirm Password"
    [(ngModel)]="confirmPassword"
    class="input-field"
  />

  <button
    class="primary-btn"
    (click)="resetPassword()">
    Reset Password
  </button>

</div>
